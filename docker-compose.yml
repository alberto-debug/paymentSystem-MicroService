services:
  payment-system-app:
    image: ${PAYFLOW_APP_IMAGE:-payment-system-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-system-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://payflow-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=payflow-redis
      - REDIS_PORT=6379
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/payflow/protocol/openid-connect/certs
      - KEYCLOAK_TOKEN_URI=http://keycloak:8080/realms/payflow/protocol/openid-connect/token
      - KEYCLOAK_AUTH_URI=${KEYCLOAK_AUTH_URI:-http://54.163.41.195:8081/realms/payflow/protocol/openid-connect/auth}
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - PAYFLOW_BFF_CLIENT_SECRET=${PAYFLOW_BFF_CLIENT_SECRET}
      - PAYFLOW_API_CLIENT_ID=${PAYFLOW_API_CLIENT_ID}
      - PAYFLOW_API_CLIENT_SECRET=${PAYFLOW_API_CLIENT_SECRET}
      - JAVA_TOOL_OPTIONS=-Xmx384m
      - FRONTEND_URL=${FRONTEND_URL:-http://54.163.41.195:3000}
    depends_on:
      - payflow-db
      - keycloak
      - payflow-redis
    networks:
      - payflow-network

  payflow-db:
    image: postgres:15-alpine
    container_name: payflow-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

    networks:
      - payflow-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://payflow-db:5432/keycloak_db
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./keycloak/themes:/opt/keycloak/themes
    ports:
      - "8081:8080"
    networks:
      - payflow-network

  payflow-redis:
    image: redis:7-alpine
    container_name: payflow-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - payflow-network

  frontend:
    image: ${PAYFLOW_FRONTEND_IMAGE:-payflow-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - payflow-network

volumes:
  postgres-data:
  keycloak-data:
  redis-data:

networks:
  payflow-network:
    driver: bridge
