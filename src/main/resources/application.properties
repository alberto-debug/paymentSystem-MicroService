spring.application.name=multidigital-wallet
server.port=8080
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Datasource & JPA
spring.datasource.url=jdbc:postgresql://localhost:5432/payflow_db
spring.datasource.username=${POSTGRES_USER:payflowAdmin}
spring.datasource.password=${POSTGRES_PASSWORD:PayflowDatabaseP4ssw0rd}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Distributed Session & Redis
spring.session.store-type=redis
spring.session.redis.namespace=payflow:session
spring.session.timeout=1800s
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Session Cookie (BFF Pattern)
server.servlet.session.cookie.name=PAYFLOW_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Lax is required for OAuth2 authorization code redirect flow
server.servlet.session.cookie.same-site=lax

# Keycloak Admin Client
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8081}
keycloak.realm=${KEYCLOAK_REALM:payflow}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/payflow/protocol/openid-connect/certs}

# OAuth2 Client - Service-to-Service (Client Credentials)
spring.security.oauth2.client.registration.payflow-api.client-id=${PAYFLOW_API_CLIENT_ID}
spring.security.oauth2.client.registration.payflow-api.client-secret=${PAYFLOW_API_CLIENT_SECRET}
spring.security.oauth2.client.registration.payflow-api.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.payflow-api.scope=payments.read,payments.write
spring.security.oauth2.client.provider.payflow-api.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/payflow/protocol/openid-connect/token}

# OAuth2 Client - User Authentication (BFF Login)
spring.security.oauth2.client.registration.keycloak.client-id=payflow-backend
spring.security.oauth2.client.registration.keycloak.client-secret=${PAYFLOW_BFF_CLIENT_SECRET:E1bdIx6iyWOLANmD6l6X96Ql5mFQiNWc}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_AUTH_URI:http://localhost:8081/realms/payflow/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/payflow/protocol/openid-connect/token}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/payflow/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
